name: deploy-pages

# Publishes the marketing site (root index.html + assets + the beta APK download)
# to GitHub Pages via the Actions deployment path. configure-pages enables the
# Pages site with source = "GitHub Actions" on first run, so no manual Settings
# step is needed. Only the files the site actually serves are shipped in the
# artifact — the rest of the repo (protocol sources, cli-os, templates) stays out.

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site artifact
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r assets _site/assets
          cp -r downloads _site/downloads
          # Fail loudly if the pieces the page links to are missing, instead of
          # publishing a site with a dead download button.
          test -f _site/assets/brand-image.png
          ls _site/downloads/*.apk >/dev/null
          test -f _site/downloads/SHA256SUMS
          du -sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>l00prite OS — Setup</title>
<script>
/* Device-authoritative theme. The Android wrapper loads this page with ?theme=dark|light taken
   from the device's night-mode setting (MainActivity.onPollFinished); we stamp it onto <html> as
   data-theme so the page's own palette — not the WebView's flaky prefers-color-scheme /
   force-dark — decides light vs dark. Persisted in localStorage so the choice survives the
   setup -> dashboard navigation (which drops the query string). Desktop browsers get no ?theme=
   and never store the key, so data-theme is never set and behavior is byte-identical to before. */
(function(){
  var m=/[?&]theme=(dark|light)\b/.exec(location.search);
  var t=m?m[1]:null;
  try{ if(t){localStorage.setItem('l00p_theme',t);} else {t=localStorage.getItem('l00p_theme');} }catch(e){}
  if(t==='dark'||t==='light'){
    document.documentElement.setAttribute('data-theme',t);
    var mc=document.querySelector('meta[name=color-scheme]');
    if(mc){ mc.content=(t==='dark'?'dark light':'light dark'); }
  }
})();
</script>
<style>
  :root{
    --bg:#07090D; --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.08); --stroke-2:rgba(255,255,255,.16);
    --text:#EEF2F8; --text-2:#9AA5B5; --text-3:#5C6675;
    --accent:#B9F432; --accent-2:#7ED957; --accent-ink:#0D1105; --glow:rgba(185,244,50,.22);
    --ok:#3DDC84; --warn:#FFB224; --err:#FF5C5C;
    --input-bg:rgba(0,0,0,.30); --input-bg-focus:rgba(0,0,0,.42); --input-bg-solid:#0A0D12;
    --font-sans:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SFMono-Regular","JetBrains Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
    --r-lg:20px; --r-md:13px; --r-sm:9px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-sans); color:var(--text); line-height:1.55; letter-spacing:.1px;
    -webkit-font-smoothing:antialiased; min-height:100vh;
    background:
      radial-gradient(1000px 540px at 85% -12%, rgba(185,244,50,.10), transparent 60%),
      radial-gradient(800px 460px at -10% 110%, rgba(126,217,87,.06), transparent 55%),
      var(--bg);
    background-attachment:fixed;
    display:flex; align-items:flex-start; justify-content:center; padding:48px 20px 64px;
  }
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:0;}
  .wrap{width:100%;max-width:640px;}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;}
  .brand .logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 8px 26px -8px var(--glow), inset 0 1px 0 rgba(255,255,255,.4);color:var(--accent-ink);font-weight:800;font-size:20px;}
  .brand .name{font-weight:750;font-size:17px;letter-spacing:.2px;}
  .brand .sub{font-size:11px;color:var(--text-3);letter-spacing:.16em;text-transform:uppercase;}

  /* stepper */
  .stepper{display:flex;gap:6px;margin-bottom:22px;}
  .stepper .s{flex:1 1 auto;height:4px;border-radius:4px;background:rgba(255,255,255,.08);transition:background .3s;}
  .stepper .s.done{background:var(--ok);}
  .stepper .s.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));}

  .card{background:linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.018));
    border:1px solid var(--stroke);border-radius:var(--r-lg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 28px 70px -38px rgba(0,0,0,.85);
    padding:30px 28px 26px;}
  .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);font-weight:700;}
  .eyebrow .tick{width:6px;height:6px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px var(--glow);}
  h1{margin:14px 0 8px;font-size:26px;font-weight:760;letter-spacing:-.5px;line-height:1.2;}
  p{margin:8px 0;color:var(--text-2);font-size:14.5px;}
  .muted{color:var(--text-3);font-size:12.5px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin:14px 0 6px;letter-spacing:.02em;}
  label .opt{color:var(--text-3);font-weight:500;}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;padding:12px 14px;border-radius:var(--r-md);background:var(--input-bg);
    border:1px solid var(--stroke);color:var(--text);font-family:var(--font-sans);font-size:14.5px;outline:none;
    transition:border-color .15s, background .15s;}
  input:focus,select:focus,textarea:focus{border-color:rgba(185,244,50,.55);background:var(--input-bg-focus);}
  input::placeholder,textarea::placeholder{color:var(--text-3);opacity:1;}
  /* Native dropdown options and autofilled values don't follow the page palette on their own —
     pin them so a field can never render its text in the same color as its background. */
  input,select,textarea{caret-color:var(--text);}
  select option{background:var(--input-bg-solid);color:var(--text);}
  input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text);
    -webkit-box-shadow:0 0 0 1000px var(--input-bg-solid) inset;}
  .mono-in{font-family:var(--font-mono);}

  .actions{display:flex;gap:10px;margin-top:26px;align-items:center;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;font-size:14.5px;font-weight:680;cursor:pointer;
    border:1px solid var(--stroke);background:var(--panel);color:var(--text);transition:transform .12s,border-color .15s,background .15s;}
  .btn:hover{border-color:var(--stroke-2);background:var(--panel-2);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 26px -12px var(--glow);}
  .btn.primary:hover{filter:brightness(1.06);}
  .btn.big{padding:14px 26px;font-size:15.5px;border-radius:14px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;}
  .btn.ghost{background:none;border-color:transparent;color:var(--text-3);}
  .btn.ghost:hover{color:var(--text);background:var(--panel);}
  .spacer{flex:1;}

  .note{margin-top:16px;padding:12px 14px;border-radius:var(--r-md);font-size:13px;border:1px solid var(--stroke);background:var(--panel);color:var(--text-2);}
  .note.ok{border-color:rgba(61,220,132,.32);background:rgba(61,220,132,.09);color:#a9f2c9;}
  .note.warn{border-color:rgba(255,178,36,.32);background:rgba(255,178,36,.09);color:#ffdf9c;}
  .note.err{border-color:rgba(255,92,92,.34);background:rgba(255,92,92,.09);color:#ffb0a8;}
  .note b{color:inherit;}
  .hidden{display:none!important;}
  .spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(125,125,125,.35);border-top-color:currentColor;animation:spin .7s linear infinite;display:inline-block;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--text-3);}

  /* provider cards */
  .pgrid{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .pcard{border:1px solid var(--stroke);border-radius:var(--r-md);background:var(--panel);
    padding:14px 16px;transition:border-color .2s, background .2s;}
  .pcard.open{border-color:var(--stroke-2);background:var(--panel-2);}
  .pcard.added{border-color:rgba(61,220,132,.4);}
  .phead{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
  .phead .pdot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
    background:rgba(255,255,255,.05);border:1px solid var(--stroke);font-weight:800;font-size:15px;color:var(--accent);}
  .pcard.added .phead .pdot{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.35);color:var(--ok);}
  .phead .pname{font-weight:700;font-size:14.5px;}
  .phead .pdesc{font-size:12px;color:var(--text-3);margin-top:1px;}
  .phead .pstate{margin-left:auto;font-size:12px;color:var(--text-3);flex:none;}
  .pcard.added .phead .pstate{color:var(--ok);font-weight:650;}
  .pbody{margin-top:12px;}
  .pbody .rowline{display:flex;gap:8px;margin-top:8px;}
  .pbody .rowline .btn{flex:none;padding:10px 14px;font-size:13px;}
  .pnote{font-size:12.5px;margin-top:8px;min-height:0;}
  .pnote.ok{color:var(--ok);}
  .pnote.err{color:var(--err);}
  .pnote.warn{color:var(--warn);}

  details.adv{margin-top:20px;border:1px solid var(--stroke);border-radius:var(--r-md);background:var(--panel);}
  details.adv summary{padding:11px 14px;font-size:12.5px;color:var(--text-3);cursor:pointer;user-select:none;list-style:none;}
  details.adv summary::-webkit-details-marker{display:none;}
  details.adv summary:hover{color:var(--text-2);}
  details.adv .advbody{padding:0 14px 14px;}

  .herosvg{display:block;margin:2px 0 4px;}
  @media (prefers-color-scheme:light){
    :root{--bg:#F6F7F9;--panel:rgba(10,20,40,.03);--panel-2:rgba(10,20,40,.05);--stroke:rgba(10,20,40,.12);--stroke-2:rgba(10,20,40,.24);
      --text:#0C1017;--text-2:#455062;--text-3:#7A8698;--accent:#5DAE10;--accent-2:#4C9410;--accent-ink:#FFFFFF;--glow:rgba(93,174,16,.22);
      --input-bg:#fff;--input-bg-focus:#fff;--input-bg-solid:#fff;}
    body{background:radial-gradient(1000px 540px at 85% -12%, rgba(185,244,50,.16), transparent 60%), var(--bg);}
    input:focus,select:focus,textarea:focus{border-color:rgba(93,174,16,.55);}
  }
  /* Explicit device-theme override (set by the head script from ?theme=/localStorage). Higher
     specificity than the bare :root above and the @media :root, so it wins the cascade in BOTH
     directions regardless of what the WebView reports for prefers-color-scheme — the actual fix
     for the black-on-black modals. Keep each block in sync with the :root + @media blocks above. */
  :root[data-theme="dark"]{color-scheme:dark;
    --bg:#07090D; --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.06);
    --stroke:rgba(255,255,255,.08); --stroke-2:rgba(255,255,255,.16);
    --text:#EEF2F8; --text-2:#9AA5B5; --text-3:#5C6675;
    --accent:#B9F432; --accent-2:#7ED957; --accent-ink:#0D1105; --glow:rgba(185,244,50,.22);
    --input-bg:rgba(0,0,0,.30); --input-bg-focus:rgba(0,0,0,.42); --input-bg-solid:#0A0D12;}
  :root[data-theme="dark"] body{background:
    radial-gradient(1000px 540px at 85% -12%, rgba(185,244,50,.10), transparent 60%),
    radial-gradient(800px 460px at -10% 110%, rgba(126,217,87,.06), transparent 55%),
    var(--bg);}
  :root[data-theme="dark"] input:focus,:root[data-theme="dark"] select:focus,:root[data-theme="dark"] textarea:focus{border-color:rgba(185,244,50,.55);}
  :root[data-theme="light"]{color-scheme:light;
    --bg:#F6F7F9;--panel:rgba(10,20,40,.03);--panel-2:rgba(10,20,40,.05);--stroke:rgba(10,20,40,.12);--stroke-2:rgba(10,20,40,.24);
    --text:#0C1017;--text-2:#455062;--text-3:#7A8698;--accent:#5DAE10;--accent-2:#4C9410;--accent-ink:#FFFFFF;--glow:rgba(93,174,16,.22);
    --input-bg:#fff;--input-bg-focus:#fff;--input-bg-solid:#fff;}
  :root[data-theme="light"] body{background:radial-gradient(1000px 540px at 85% -12%, rgba(185,244,50,.16), transparent 60%), var(--bg);}
  :root[data-theme="light"] input:focus,:root[data-theme="light"] select:focus,:root[data-theme="light"] textarea:focus{border-color:rgba(93,174,16,.55);}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">∞</div>
    <div><div class="name">l00prite OS</div><div class="sub">First-run setup</div></div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="card" id="card"><div class="muted">Loading…</div></div>

  <div class="foot">Your keys stay on this device — encrypted at rest, validated once with a real call,
    never sent anywhere except their own provider.</div>
</div>

<script>
"use strict";
(function(){
  // ---- step model: welcome (vault auto-init) -> providers -> done (token auto-mint) ----
  const STEPS = ["welcome","providers","done"];
  const state = { status:null, added:[] };
  let current = "welcome";
  let renderGen = 0; // bumped on every render() so a stale async step can bail before touching the DOM

  const card = document.getElementById("card");
  const stepperEl = document.getElementById("stepper");

  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  async function api(method, path, body, headers){
    const opt = {method, headers:headers||{}};
    if(body!==undefined){ opt.headers["content-type"]="application/json"; opt.body=JSON.stringify(body); }
    const res = await fetch(path, opt);
    let data=null; try{ data = await res.json(); }catch(e){}
    return {res, data};
  }
  function errMsg(data, fallback){
    if(data && data.error && data.error.message) return data.error.message;
    if(data && data.detail) return data.detail;
    if(data && data.error && typeof data.error==="string") return data.error;
    return fallback || "Something went wrong.";
  }

  // ---- Add-provider presets (served by GET /v1/providers/catalog; static embedded manifest facts) ----
  const CUSTOM_PRESET = {key:"custom", display_name:"Custom / other (OpenAI-compatible)",
                         adapter:"openai-compat", base_url:"", sample_model:null};
  const FALLBACK_PRESETS = [{key:"anthropic", display_name:"Anthropic (Claude)",
                             adapter:"native-messages", base_url:"https://api.anthropic.com",
                             sample_model:"claude-fable-5"}];
  let presetsPromise = null;
  function loadPresets(){                       // cached across calls; a failure is NOT cached
    if(!presetsPromise){
      presetsPromise = fetch("/v1/providers/catalog")
        .then(r => r.ok ? r.json() : null)
        .then(d => (d && Array.isArray(d.presets) && d.presets.length) ? d.presets : null)
        .catch(() => null)
        .then(p => { if(!p) presetsPromise = null; return p || FALLBACK_PRESETS; });
    }
    return presetsPromise;
  }

  function renderStepper(){
    const idx = STEPS.indexOf(current);
    stepperEl.innerHTML = STEPS.map((s,i)=>{
      const cls = i<idx ? "s done" : (i===idx ? "s active" : "s");
      return `<div class="${cls}"></div>`;
    }).join("");
  }

  async function loadStatus(){
    const {res, data} = await api("GET","/v1/setup/status");
    if(!res.ok){ card.innerHTML = `<div class="note err">Could not reach the setup API (${res.status}).</div>`; return; }
    state.status = data;
    if(data.setup_complete){ return renderAlreadyDone(); }
    // Resume at the earliest incomplete step, but never before welcome on a fresh load.
    if(current==="welcome"){ /* stay on welcome first */ }
    else { current = data.next_step==="done" ? "done" : data.next_step; }
    render();
  }

  function goto(step){ current = step; render(); }

  function render(){
    renderGen++;
    renderStepper();
    ({welcome:renderWelcome, providers:renderProviders, done:renderDone}[current])();
  }

  // ---- step 1: welcome (+ invisible vault init) ----
  function renderWelcome(){
    const vaultDone = state.status && state.status.vault_initialized;
    card.innerHTML = `
      <div class="eyebrow"><span class="tick"></span> Welcome</div>
      <h1>Your AI crew,<br>your keys, your device.</h1>
      <p>l00prite is one place to talk to every AI provider you have a key for — Claude, GPT, Gemini,
         Grok, Kimi and more — point them at a repo, and let them build. Keys are encrypted on-device
         and never leave except to their own provider.</p>
      ${vaultDone?`<div class="note ok"><b>Vault ready.</b> Your encrypted key vault is already set up.</div>`:""}
      <details class="adv" id="advkey" ${vaultDone?'open style="display:none"':""}>
        <summary>Advanced: use my own master key</summary>
        <div class="advbody">
          <p class="muted" style="margin-top:4px">The vault master key encrypts every provider key at rest
            (AES-256-GCM). Normally it's generated for you. Paste a base64-encoded 32-byte key only to reuse
            an existing vault.</p>
          <input type="password" id="mkey" class="mono-in" placeholder="base64 of 32 bytes…" autocomplete="off">
        </div>
      </details>
      <div id="wnote"></div>
      <div class="actions">
        <div class="spacer"></div>
        <button class="btn primary big" id="go">Get started →</button>
      </div>`;
    document.getElementById("go").onclick=async(e)=>{
      const btn=e.target, note=document.getElementById("wnote");
      btn.disabled=true; btn.innerHTML=`<span class="spin"></span> Preparing…`;
      if(!vaultDone){
        const mk=(document.getElementById("mkey")||{}).value;
        const body={}; if(mk && mk.trim()) body.master_key=mk.trim();
        const {res,data}=await api("POST","/v1/setup/vault",body);
        if(!res.ok && !(data && data.error && data.error.code==="vault_already_initialized")){
          btn.disabled=false; btn.innerHTML="Get started →";
          note.innerHTML=`<div class="note err">${esc(errMsg(data,"Could not initialize the vault."))}</div>`;
          return;
        }
        state.status.vault_initialized=true;
      }
      goto("providers");
    };
  }

  // ---- step 2: providers (card per preset, validate+add inline, multiple allowed) ----
  async function renderProviders(){
    const myGen = renderGen;
    const presets = (await loadPresets()).concat([CUSTOM_PRESET]);
    if(myGen !== renderGen) return; // user navigated away while the catalog was loading
    const already = (state.status.provider_count||0) > 0;
    card.innerHTML = `
      <div class="eyebrow"><span class="tick"></span> Step 1 of 2 · Providers</div>
      <h1>Connect your providers</h1>
      <p>Paste an API key for each provider you use. Each key is <b>validated with a real call</b> before
         it's saved — a bad key fails here, not mid-conversation. Add as many as you like.</p>
      <div class="pgrid" id="pgrid"></div>
      <div id="skipwrap">${already||state.added.length?"":`
        <p class="muted" style="text-align:center;margin-top:18px">No keys handy?
          <a href="#" id="skip" style="color:var(--text-2)">Skip for now</a> — you can add providers anytime.</p>`}
      </div>
      <div class="actions">
        <button class="btn ghost" id="back">← Back</button>
        <div class="spacer"></div>
        <button class="btn primary big" id="next" ${state.added.length||already?"":"disabled"}>Continue →</button>
      </div>`;
    document.getElementById("back").onclick=()=>goto("welcome");
    document.getElementById("next").onclick=()=>goto("done");
    const skip=document.getElementById("skip");
    if(skip) skip.onclick=(e)=>{ e.preventDefault(); goto("done"); };

    const grid=document.getElementById("pgrid");
    presets.forEach(p=>{
      const el=document.createElement("div");
      el.className="pcard"; el.dataset.key=p.key;
      const initial=(p.display_name||p.key).trim().charAt(0).toUpperCase()||"◆";
      el.innerHTML=`
        <div class="phead">
          <div class="pdot">${esc(initial)}</div>
          <div><div class="pname">${esc(p.display_name)}</div>
          <div class="pdesc">${p.key==="custom"?"Any OpenAI-compatible endpoint":(p.sample_model?("e.g. "+p.sample_model):"API key required")}</div></div>
          <div class="pstate"></div>
        </div>
        <div class="pbody hidden">
          ${p.key==="custom"?`
            <label>Name</label><input type="text" class="mono-in pv-name" placeholder="my-provider">
            <label>Base URL</label><input type="text" class="mono-in pv-base" placeholder="https://api.openai.com/v1">
            <label>Model to test</label><input type="text" class="mono-in pv-model" placeholder="e.g. gpt-5">`:""}
          <label>API key</label>
          <div class="rowline">
            <input type="password" class="mono-in pv-key" placeholder="Paste your key…" autocomplete="off">
            <button class="btn pv-add">Validate &amp; add</button>
          </div>
          <label style="font-weight:500"><input type="checkbox" class="pv-skip" style="accent-color:var(--accent);margin-right:6px">Add without validating <span class="opt">(offline)</span></label>
          <div class="pnote"></div>
        </div>`;
      grid.appendChild(el);
      const head=el.querySelector(".phead"), body=el.querySelector(".pbody"),
            stateEl=el.querySelector(".pstate"), note=el.querySelector(".pnote"),
            addBtn=el.querySelector(".pv-add"), keyIn=el.querySelector(".pv-key"),
            skipBox=el.querySelector(".pv-skip");
      head.onclick=()=>{
        if(el.classList.contains("added")) return;
        const open=el.classList.toggle("open");
        body.classList.toggle("hidden",!open);
        if(open) keyIn.focus();
      };
      addBtn.onclick=async()=>{
        const isCustom=p.key==="custom";
        const name=isCustom?(el.querySelector(".pv-name").value.trim()):p.key;
        const base=isCustom?(el.querySelector(".pv-base").value.trim()):(p.base_url||"");
        const model=isCustom?(el.querySelector(".pv-model").value.trim()):(p.sample_model||"");
        const key=keyIn.value;
        if(isCustom && !name){ note.className="pnote err"; note.textContent="Give the provider a name."; return; }
        if(isCustom && !base){ note.className="pnote err"; note.textContent="A base URL is required."; return; }
        if(!key){ note.className="pnote err"; note.textContent="Paste an API key first."; return; }
        addBtn.disabled=true; addBtn.innerHTML=`<span class="spin"></span> Checking…`;
        note.className="pnote"; note.textContent="";
        const reqBody={name, adapter:p.adapter, base_url:base, api_key:key, model};
        if(!skipBox.checked){
          const t=await api("POST","/v1/setup/provider/test",reqBody);
          if(!(t.res.ok && t.data && t.data.ok)){
            addBtn.disabled=false; addBtn.textContent="Validate & add";
            note.className="pnote err";
            note.textContent="Validation failed: "+((t.data&&t.data.error)||errMsg(t.data,"the provider rejected the call"));
            return;
          }
        }
        reqBody.default = (state.added.length===0 && !already); // first provider becomes the default
        reqBody.skip_validation = skipBox.checked;
        const a=await api("POST","/v1/setup/provider",reqBody);
        addBtn.disabled=false; addBtn.textContent="Validate & add";
        if(!a.res.ok){
          note.className="pnote err"; note.textContent=errMsg(a.data,"Could not add the provider.");
          return;
        }
        el.classList.add("added"); el.classList.remove("open");
        body.classList.add("hidden");
        stateEl.textContent="✓ Connected";
        state.added.push(name);
        state.status.provider_count=(state.status.provider_count||0)+1;
        const next=document.getElementById("next"); if(next) next.disabled=false;
        const sw=document.getElementById("skipwrap"); if(sw) sw.innerHTML="";
      };
    });
  }

  // ---- step 3: done (token minted + session exchanged invisibly) ----
  async function renderDone(){
    const myGen = renderGen;
    card.innerHTML = `
      <div class="eyebrow"><span class="tick" style="background:var(--ok)"></span> All set</div>
      <h1>You're in.</h1>
      <p id="dstatus"><span class="spin"></span> Finishing up…</p>
      <div id="dnote"></div>
      <div class="actions">
        <div class="spacer"></div>
        <button class="btn primary big" id="start" disabled>Start chatting →</button>
      </div>
      <p class="muted" style="margin-top:18px">Tip: manage providers, repositories, budgets and API tokens
        anytime from inside the app.</p>`;
    const status=document.getElementById("dstatus"), note=document.getElementById("dnote"),
          start=document.getElementById("start");
    // Mint the app's own gateway token and exchange it once for the HttpOnly UI session. The raw
    // token is never persisted by this page — more tokens can be minted later under Advanced → Tokens.
    const m=await api("POST","/v1/setup/token",{project:"default"});
    if(myGen!==renderGen) return;
    if(!m.res.ok || !m.data || !m.data.token){
      status.innerHTML="Setup is complete, but the app session couldn't start automatically.";
      note.innerHTML=`<div class="note err">${esc(errMsg(m.data,"Could not mint the app token."))} You can retry, or open the app and sign in with a token.</div>`;
      const r=document.createElement("button"); r.className="btn"; r.textContent="Retry"; r.style.marginTop="12px";
      r.onclick=()=>render(); note.appendChild(r);
      return;
    }
    const s=await fetch("/v1/ui/session",{method:"POST",headers:{authorization:"Bearer "+m.data.token}}).catch(()=>null);
    if(myGen!==renderGen) return;
    if(!s || !s.ok){
      status.innerHTML="Setup is complete, but the app session couldn't start automatically.";
      note.innerHTML=`<div class="note err">Session exchange failed. You can still open the app and sign in with a token from Advanced → Tokens.</div>`;
      return;
    }
    status.innerHTML="Your workspace is ready — everything runs right here on this device.";
    start.disabled=false;
    start.onclick=()=>{ location.href="/"; };
  }

  function renderAlreadyDone(){
    current="done"; renderStepper();
    card.innerHTML = `
      <div class="eyebrow"><span class="tick" style="background:var(--ok)"></span> Already configured</div>
      <h1>Setup is already complete</h1>
      <p>This gateway is configured — the setup endpoints are disabled. Head into the app, or use the
         CLI (<span class="mono">l00prite provider add</span>, <span class="mono">token mint</span>) to make changes.</p>
      <div class="actions"><div class="spacer"></div><button class="btn primary big" id="dash">Open the app →</button></div>`;
    document.getElementById("dash").onclick=()=>location.href="/";
  }

  loadStatus();
})();
</script>
</body>
</html>
